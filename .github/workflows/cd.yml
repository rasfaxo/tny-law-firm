name: CD Pipeline - Deploy to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: staging-cd
  cancel-in-progress: false

jobs:
  build:
    name: Build Deployment Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend Production Assets
        run: npm run build

      - name: Validate Vite Build Output
        run: |
          test -d public/build
          test -f public/build/manifest.json
          test -d public/build/assets
          find public/build/assets -type f -name '*.css' | grep -q .
          find public/build/assets -type f -name '*.js' | grep -q .

      - name: Install PHP Production Dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-ansi

      - name: Prepare Deployment Package
        run: |
          mkdir -p release

          # Copy core application directories and essential runtime files
          cp -r app bootstrap config database public resources routes vendor release/
          
          # Copy optional runtime files if present
          [ -d certs ] && cp -r certs release/ || true
          [ -f artisan ] && cp artisan release/ || true
          [ -f composer.json ] && cp composer.json release/ || true
          [ -f Procfile ] && cp Procfile release/ || true
          [ -f default ] && cp default release/ || true
          [ -f startup.sh ] && cp startup.sh release/ || true
          chmod +x release/startup.sh 2>/dev/null || true

          # Ensure clean storage directory structure
          mkdir -p \
            release/storage/app/public \
            release/storage/app/private \
            release/storage/framework/cache/data \
            release/storage/framework/sessions \
            release/storage/framework/testing \
            release/storage/framework/views \
            release/storage/logs \
            release/bootstrap/cache

          touch release/storage/app/public/.gitkeep
          touch release/storage/app/private/.gitkeep
          touch release/storage/framework/cache/.gitkeep
          touch release/storage/framework/cache/data/.gitkeep
          touch release/storage/framework/sessions/.gitkeep
          touch release/storage/framework/testing/.gitkeep
          touch release/storage/framework/views/.gitkeep
          touch release/storage/logs/.gitkeep

          # Ensure clean bootstrap cache directory
          rm -f release/bootstrap/cache/*.php
          touch release/bootstrap/cache/.gitkeep

          # Validate release directory Vite build output
          test -d release/public/build
          test -f release/public/build/manifest.json
          test -d release/public/build/assets
          find release/public/build/assets -type f -name '*.css' | grep -q .
          find release/public/build/assets -type f -name '*.js' | grep -q .

          # Diagnostic output
          echo "=== RELEASE VITE BUILD ==="
          find release/public/build -maxdepth 2 -type f -printf '%p %s bytes\n'

          echo "=== RELEASE MANIFEST ==="
          cat release/public/build/manifest.json

          # Validate essential runtime directories and files
          test -d release/storage/framework/views
          test -d release/storage/framework/sessions
          test -d release/storage/framework/cache/data
          test -d release/storage/logs
          test -d release/bootstrap/cache
          test -f release/default
          test -f release/public/index.php

          # Create production deployment zip artifact
          cd release
          zip -r -q ../release.zip .
          cd ..

      - name: Validate Deployment ZIP Package
        run: |
          test -f release.zip

          echo "=== ZIP FILE DETAILS ==="
          ls -lh release.zip
          sha256sum release.zip

          echo "=== VERIFYING REQUIRED FILES IN ZIP ==="
          unzip -l release.zip | grep 'public/build/manifest.json'
          unzip -l release.zip | grep -E 'public/build/assets/.*\.css'
          unzip -l release.zip | grep -E 'public/build/assets/.*\.js'
          unzip -l release.zip | grep 'storage/framework/views'
          unzip -l release.zip | grep 'storage/framework/sessions'
          unzip -l release.zip | grep 'storage/framework/cache/data'
          unzip -l release.zip | grep 'bootstrap/cache'
          unzip -l release.zip | grep 'default'

      - name: Upload Deployment Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifact
          path: release.zip
          retention-days: 7

  deploy:
    name: Deploy to Azure App Service
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Deployment Artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-artifact

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip

      - name: Smoke Test (Health Check)
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
        run: |
          if [ -z "$STAGING_URL" ]; then
            echo "::error::STAGING_URL secret is not set!"
            exit 1
          fi

          echo "Waiting 40 seconds for Azure App Service to fully initialize..."
          sleep 40
          
          echo "Checking basic connectivity..."
          curl -v "$STAGING_URL" 2>&1 | head -20 || true
          
          echo "Testing Landing Page (GET /)..."
          curl -fL --retry 12 --retry-delay 5 --retry-all-errors "$STAGING_URL" > /dev/null
          
          echo "Testing Login Page (GET /login)..."
          curl -fL --retry 12 --retry-delay 5 --retry-all-errors "$STAGING_URL/login" > /dev/null
          
          echo "Smoke tests passed successfully!"
